<!DOCTYPE html>
<html lang="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="© 2024 NINS (by JPGT). By using any of the services, it means you have agreed to any content and all content!">
<title>nins/Chat</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    background-color: #000000;
  }

  .header-ctrl {
    position: sticky;
    top: 0;
    background-color: #ffffff; 
    padding: 15px 20px;       
    z-index: 1000;            
    border-bottom: 1px solid #e0e0e0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    box-sizing: border-box;
    width: 100%;
  }

  .chat-card {
    border: 1px solid #ccc;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
    background-color: #ffffff;
  }

/* 卡片頂部的資訊欄 (Index 上，時間 下) */
  .card-header {
    display: flex;
    flex-direction: column; /* 設為垂直排列 */
    align-items: flex-start; /* 靠左對齊，若想靠右可改為 flex-end */
    gap: 4px;                /* 上下增加一點間距 */
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px dashed #eee;
  }
  .card-index {
    font-weight: bold;
    color: #2196F3;
  }
  .card-time {
    font-family: monospace;
  }

  textarea {
    width: 100%;
    height: 60px;
    margin-bottom: 8px;
    box-sizing: border-box;
  }
  .button-group {
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  button {
    padding: 6px 12px;
    cursor: pointer;
  }
  .btn-add {
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
  }
  .btn-load {
    background-color: #aa05fc;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
  }
  .btn-send {
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
  }
  .btn-stop {
    background-color: #f44336;
    color: white;
    border: none;
    border-radius: 4px;
  }
  button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }
  pre {
    background-color: #eee;
    padding: 10px;
    white-space: pre-wrap;
    min-height: 40px;
    border-radius: 4px;
    margin: 0;
  }
  .status {
    font-size: 12px;
    color: #666;
  }

  /* 調整單一卡片內的模型選單樣式 */
  .select-model {
    height: 32px;
    padding: 0 8px;
    font-size: 13px;
    font-weight: bold;
    color: #333;
    background-color: #fffbcf;
    border: 1px solid #ccc;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  .select-model:focus {
    border-color: #2196F3;
  }

  /* 底部的 padding 降低（因已無固定底部選單） */
  #container {
    padding: 20px;
  }
</style>
</head>
<body>

<!-- 頭部控制區塊 -->
<div class="header-ctrl">
  <button class="btn-add" onclick="addCard()">+ NEW</button>
  <button class="btn-load" onclick="downloadAllText()">* DOWNLOAD</button>
</div>

<!-- 動態卡片容器 -->
<div id="container"></div>

<script>
let cardCounter = 0;

window.onload = function() {
    addCard();
};

function addCard(defaultText = "") {
    const nins = `My language code is ${navigator.language}! Please respond in ${navigator.language}! ...`;
    const container = document.getElementById("container");
    defaultText = nins;

    cardCounter++;

    const utc = new Date().toISOString();
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const offset = (() => {
        const minutes = -new Date().getTimezoneOffset();
        const sign = minutes >= 0 ? "+" : "-";
        const hh = String(Math.floor(Math.abs(minutes) / 60)).padStart(2, "0");
        const mm = String(Math.abs(minutes) % 60).padStart(2, "0");
        return `${sign}${hh}:${mm}`;
    })();

    // 建立卡片容器
    const card = document.createElement("div");
    card.className = "chat-card";

    // 建立頁眉
    const cardHeader = document.createElement("div");
    const formattedIndex = String(cardCounter).padStart(3, '0');
    cardHeader.className = "card-header";
    cardHeader.innerHTML = `
        <span class="card-index">#${formattedIndex} ${timezone}</span>
        <span class="card-time">${utc} ${offset}</span>
    `;

    // 建立 Textarea
    const textarea = document.createElement("textarea");
    textarea.value = defaultText;
    textarea.placeholder = "INPUT...";

    // 建立卡片專屬的模型下拉選單
    const modelSelect = document.createElement("select");
    modelSelect.className = "select-model";
    modelSelect.innerHTML = `
        <option value="gemma3:270m" selected>gemma3:270m</option>
        <option value="llama3.2:1b">llama3.2:1b</option>
        <option value="qwen2.5-coder:3b">qwen2.5-coder:3b</option>
    `;

    // 建立按鈕組
    const btnGroup = document.createElement("div");
    btnGroup.className = "button-group";

    const sendBtn = document.createElement("button");
    sendBtn.textContent = "Send";
    sendBtn.className = "btn-send";

    const stopBtn = document.createElement("button");
    stopBtn.textContent = "Stop";
    stopBtn.className = "btn-stop";
    stopBtn.disabled = true;

    const statusSpan = document.createElement("span");
    statusSpan.className = "status";

    // 將按鈕與卡片專屬的 select 放進按鈕組
    btnGroup.appendChild(sendBtn);
    btnGroup.appendChild(stopBtn);
    btnGroup.appendChild(modelSelect); // <--- 加入選單
    btnGroup.appendChild(statusSpan);

    // 建立獨立接收框
    const out = document.createElement("pre");

    let currentController = null;

    // 綁定「Send」事件
    sendBtn.onclick = function() {
        if (currentController) {
            currentController.abort();
        }

        currentController = new AbortController();

        sendBtn.disabled = true;
        stopBtn.disabled = false;
        modelSelect.disabled = true; // 生成中時鎖定選單
        statusSpan.textContent = "生成中...";

        // 將選中的模型值 (modelSelect.value) 傳給 send 函式
        send(
            textarea.value, 
            modelSelect.value, 
            out, 
            currentController.signal,
            () => {
                sendBtn.disabled = false;
                stopBtn.disabled = true;
                modelSelect.disabled = false;
                currentController = null;
            },
            (statusText) => {
                statusSpan.textContent = statusText;
            }
        );
    };

    // 綁定「Stop」事件
    stopBtn.onclick = function() {
        if (currentController) {
            currentController.abort();
            statusSpan.textContent = "已手動停止";
        }
    };

    // 組合卡片並插入
    card.appendChild(cardHeader);
    card.appendChild(textarea);
    card.appendChild(btnGroup);
    card.appendChild(out);

    container.prepend(card);
}

function downloadAllText() {
    let resultText = "";
    
    const cards = document.querySelectorAll('.chat-card');
    
    cards.forEach((card) => {
        const headerText = card.querySelector('.card-header')?.innerText || '';
        const selectedModel = card.querySelector('.select-model')?.value || '';
        const inputText = card.querySelector('textarea')?.value || '';
        const outputText = card.querySelector('pre')?.innerText || '';

        resultText += `\n`;
        resultText += `${headerText} === [Model: ${selectedModel}]\n`;
        resultText += `[INPUT]: ${inputText}\n`;
        resultText += `[OUTPUT]: ${outputText}\n`;
        resultText += `----------------------------------------\n`;
    });

    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(["\uFEFF" + resultText], { type: 'text/plain;charset=utf-8' }));
    a.download = `nins-chat-${Date.now()}.txt`;
    a.click();
}

// 修改 send 函式：新增 selectedModel 參數
async function send(promptText, selectedModel, outputElement, signal, onComplete, setStatus) {
    outputElement.textContent = "";

    try {
        const res = await fetch(
            "https://duguaynins-ollama.hf.space/api/generate",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: selectedModel, // 使用卡片傳入的模型名稱
                    prompt: promptText,
                    stream: true
                }),
                signal: signal
            }
        );

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split("\n");

            for (const line of lines) {
                if (!line.trim()) continue;

                const data = JSON.parse(line);

                if (data.response) {
                    outputElement.textContent += data.response;
                }

                if (data.done) {
                    setStatus("完成");
                }
            }
        }
    } catch (err) {
        if (err.name === 'AbortError') {
            outputElement.textContent += "\n\n[系統：已停止生成]";
        } else {
            outputElement.textContent = "發生錯誤：" + err.message;
            setStatus("錯誤");
        }
    } finally {
        onComplete();
    }
}
</script>

</body>
</html>
